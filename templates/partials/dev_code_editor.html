<div
    class="w-full min-w-0 max-w-full overflow-hidden"
    data-dev-code-editor
    aria-label="Code preview animation"
    role="region"
>
    <div class="code-terminal overflow-hidden rounded-xl border border-slate-800/90 bg-slate-950 shadow-lg sm:rounded-2xl dark:border-slate-700">
        <div class="flex min-w-0 items-center justify-between gap-2 border-b border-slate-800 px-3 py-2 sm:px-4 sm:py-2.5">
            <div class="flex shrink-0 items-center gap-1.5 sm:gap-2">
                <span class="h-2 w-2 rounded-full bg-rose-400 sm:h-2.5 sm:w-2.5" aria-hidden="true"></span>
                <span class="h-2 w-2 rounded-full bg-amber-300 sm:h-2.5 sm:w-2.5" aria-hidden="true"></span>
                <span class="h-2 w-2 rounded-full bg-emerald-400 sm:h-2.5 sm:w-2.5" aria-hidden="true"></span>
            </div>
            <span class="min-w-0 truncate font-mono text-[10px] text-slate-500 sm:text-[11px]" data-dev-filename>main.py</span>
            <span class="shrink-0 rounded-full bg-slate-800 px-1.5 py-0.5 font-mono text-[9px] uppercase tracking-wide text-emerald-300 sm:px-2 sm:text-[10px]" data-dev-lang>Python</span>
        </div>
        <pre class="dev-code-screen m-0 max-w-full overflow-hidden p-3 font-mono text-[10px] leading-relaxed text-slate-300 sm:p-4 sm:text-[11px]"><code class="block max-w-full overflow-hidden whitespace-pre" data-dev-code-output></code><span class="dev-caret" data-dev-caret aria-hidden="true"></span></pre>
    </div>
</div>
