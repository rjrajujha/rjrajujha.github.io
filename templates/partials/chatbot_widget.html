<section id="chatbot-root" class="chat-root" aria-label="Ask Raju assistant">
    <button
        id="chatbot-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="chatbot-panel"
        class="chat-fab"
    >
        <svg viewBox="0 0 24 24" class="chat-fab-icon" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 16.5a2.5 2.5 0 0 1-2.5 2.5H7l-4 3.5V6.5A2.5 2.5 0 0 1 5.5 4h15A2.5 2.5 0 0 1 21 6.5v10Z"></path>
        </svg>
        <span class="chat-fab-label">Ask Raju</span>
    </button>

    <div
        id="chatbot-panel"
        class="chat-panel is-closed"
        role="dialog"
        aria-modal="true"
        aria-labelledby="chatbot-title"
        aria-hidden="true"
    >
        <header class="chat-header">
            <span class="chat-avatar" aria-hidden="true">RJ</span>
            <div class="chat-header-text">
                <h2 id="chatbot-title" class="chat-title">Ask Raju</h2>
                <p class="chat-subtitle">Projects, stack, and hiring context</p>
            </div>
            <div class="chat-header-actions">
                <button
                    id="chatbot-clear"
                    type="button"
                    class="chat-icon-btn chat-icon-btn-danger"
                    aria-label="Clear conversation"
                    title="Clear conversation"
                >
                    <svg viewBox="0 0 24 24" class="chat-icon" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7h14Z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 11v5M14 11v5"></path>
                    </svg>
                </button>
                <button id="chatbot-close" type="button" class="chat-icon-btn" aria-label="Close chat">
                    <svg viewBox="0 0 24 24" class="chat-icon" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6 6 18"></path>
                    </svg>
                </button>
            </div>
        </header>

        <div class="chat-body">
            <div id="chatbot-messages" class="chat-messages" role="log" aria-live="polite" aria-atomic="false" tabindex="0" aria-label="Chat messages">
                <div id="chatbot-messages-inner" class="chat-messages-inner">
                    <div id="chatbot-empty-state" class="chat-suggestions">
                        <p class="chat-suggestions-title">What would you like to know?</p>
                        <p class="chat-suggestions-lead">Pick a prompt or type your own question.</p>
                        <div class="chat-suggestions-list" role="group" aria-label="Suggested questions">
                            <button type="button" class="chat-suggestion" data-chat-suggestion="Tell me about SyncWave">Tell me about SyncWave</button>
                            <button type="button" class="chat-suggestion" data-chat-suggestion="What is your backend stack?">What is your backend stack?</button>
                            <button type="button" class="chat-suggestion" data-chat-suggestion="Are you open to remote backend roles?">Are you open to remote backend roles?</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <form id="chatbot-form" class="chat-composer" novalidate>
            <div class="chat-composer-inner">
                <label for="chatbot-input" class="sr-only">Message</label>
                <textarea
                    id="chatbot-input"
                    class="chat-input"
                    placeholder="Message Raju's assistant…"
                    autocomplete="off"
                    maxlength="1000"
                    rows="1"
                    required
                ></textarea>
                <button
                    id="chatbot-send"
                    type="submit"
                    class="chat-send-btn"
                    aria-label="Send message"
                >
                    <svg viewBox="0 0 24 24" class="chat-icon" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0-7 7m7-7 7 7"></path>
                    </svg>
                </button>
            </div>
        </form>
    </div>
</section>
