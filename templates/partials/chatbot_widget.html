<section id="chatbot-root" class="fixed bottom-4 right-4 z-50 sm:bottom-6 sm:right-6">
    <button
        id="chatbot-toggle"
        type="button"
        class="flex items-center gap-2 rounded-full bg-slate-900 px-5 py-3 text-sm font-medium text-white shadow-lg shadow-slate-400 transition hover:bg-slate-700"
    >
        Ask Raju
    </button>

    <div id="chatbot-panel" class="mt-3 hidden w-[min(92vw,360px)] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl">
        <header class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
            <div>
                <h3 class="font-heading text-sm font-semibold text-slate-900">Portfolio Assistant</h3>
                <p class="text-xs text-slate-500">Ask me anything about Raju Jha</p>
            </div>
            <button id="chatbot-close" type="button" class="text-sm text-slate-500 transition hover:text-slate-800">Close</button>
        </header>

        <div id="chatbot-messages" class="max-h-80 space-y-3 overflow-y-auto bg-slate-50 px-4 py-4"></div>

        <form id="chatbot-form" class="flex gap-2 border-t border-slate-200 p-3">
            <input
                id="chatbot-input"
                type="text"
                placeholder="Ask about projects, skills, experience..."
                class="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none transition focus:border-emerald-400 focus:ring-2 focus:ring-emerald-200"
                maxlength="1000"
                required
            >
            <button type="submit" class="rounded-lg bg-emerald-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-emerald-500">Send</button>
        </form>
    </div>
</section>
