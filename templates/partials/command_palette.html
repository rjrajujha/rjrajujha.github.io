<div id="command-palette" class="command-palette is-closed" role="dialog" aria-modal="true" aria-label="Command palette" aria-hidden="true">
    <div class="command-palette-backdrop" data-command-palette-close></div>
    <div class="command-palette-panel" role="document">
        <div class="command-palette-input-wrap">
            <input
                id="command-palette-input"
                type="search"
                class="command-palette-input"
                placeholder="Search sections, projects, commands…"
                autocomplete="off"
                spellcheck="false"
                role="combobox"
                aria-label="Search"
                aria-expanded="false"
                aria-controls="command-palette-results"
                aria-autocomplete="list"
            >
            <kbd class="docs-kbd command-palette-esc">Esc</kbd>
        </div>
        <ul id="command-palette-results" class="command-palette-results" role="listbox" aria-label="Results"></ul>
        <p class="command-palette-hint">↑↓ navigate · Home/End · Enter to open</p>
    </div>
</div>
