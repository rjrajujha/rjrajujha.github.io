<section
    id="global-modal"
    class="pointer-events-none fixed inset-0 z-[70] flex items-center justify-center p-4 opacity-0 transition duration-200"
    aria-hidden="true"
>
    <button
        id="global-modal-backdrop"
        type="button"
        class="absolute inset-0 h-full w-full cursor-default bg-slate-950/55 backdrop-blur-[2px]"
        aria-label="Close dialog"
        tabindex="-1"
    ></button>

    <div
        id="global-modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="global-modal-heading"
        aria-describedby="global-modal-body"
        class="relative z-10 w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-5 text-left shadow-2xl outline-none transition dark:border-slate-700 dark:bg-slate-900 sm:p-6"
        tabindex="-1"
    >
        <button
            id="global-modal-close"
            type="button"
            class="absolute right-3 top-3 hidden rounded-lg p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400/70 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100"
            aria-label="Close dialog"
        >
            <svg viewBox="0 0 24 24" class="h-5 w-5 fill-none stroke-current stroke-[1.75]" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6 6 18"></path>
            </svg>
        </button>
        <p id="global-modal-title" class="font-mono text-[11px] uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400"></p>
        <h2 id="global-modal-heading" class="mt-2 font-heading text-xl font-semibold text-slate-900 dark:text-slate-100"></h2>
        <div id="global-modal-body" class="mt-3 text-sm leading-relaxed text-slate-700 dark:text-slate-300"></div>

        <div id="global-modal-actions" class="mt-6 flex flex-wrap justify-end gap-2">
            <button
                id="global-modal-cancel"
                type="button"
                class="rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:border-slate-400 hover:text-slate-900 disabled:cursor-not-allowed disabled:opacity-60 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:border-slate-500 dark:hover:text-slate-100"
            >
                Cancel
            </button>
            <button
                id="global-modal-ok"
                type="button"
                class="rounded-full bg-slate-900 px-5 py-2 text-sm font-semibold text-white transition hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-60 dark:bg-emerald-500 dark:text-slate-950 dark:hover:bg-emerald-400"
            >
                OK
            </button>
            <button
                id="global-modal-submit"
                type="button"
                class="rounded-full bg-emerald-600 px-5 py-2 text-sm font-semibold text-white transition hover:bg-emerald-500 disabled:cursor-not-allowed disabled:opacity-60 dark:bg-emerald-500 dark:text-slate-950 dark:hover:bg-emerald-400"
            >
                Submit
            </button>
        </div>
    </div>
</section>
