<section
    id="global-modal"
    class="app-modal-root"
    aria-hidden="true"
>
    <button
        id="global-modal-backdrop"
        type="button"
        class="app-modal-backdrop"
        aria-label="Close dialog"
        tabindex="-1"
    ></button>

    <div
        id="global-modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="global-modal-heading"
        aria-describedby="global-modal-body"
        class="app-modal-panel"
        tabindex="-1"
    >
        <button
            id="global-modal-close"
            type="button"
            class="app-modal-close"
            aria-label="Close dialog"
        >
            <svg viewBox="0 0 24 24" class="app-modal-close-icon" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6 6 18"></path>
            </svg>
        </button>
        <p id="global-modal-title" class="app-modal-eyebrow"></p>
        <h2 id="global-modal-heading" class="app-modal-heading"></h2>
        <div id="global-modal-body" class="app-modal-body"></div>

        <div id="global-modal-actions" class="app-modal-actions">
            <button id="global-modal-cancel" type="button" class="app-btn app-btn-secondary">Cancel</button>
            <button id="global-modal-ok" type="button" class="app-btn app-btn-primary">OK</button>
            <button id="global-modal-submit" type="button" class="app-btn app-btn-primary">Submit</button>
        </div>
    </div>
</section>
