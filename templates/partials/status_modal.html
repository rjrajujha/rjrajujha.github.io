<section
    id="status-modal"
    class="app-modal-root app-modal-status-root"
    aria-hidden="true"
>
    <button
        id="status-modal-backdrop"
        type="button"
        class="app-modal-backdrop"
        aria-label="Close dialog"
        tabindex="-1"
    ></button>

    <div
        id="status-modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="status-modal-heading"
        aria-describedby="status-modal-body"
        class="app-modal-panel"
        tabindex="-1"
    >
        <p id="status-modal-title" class="app-modal-eyebrow"></p>
        <h2 id="status-modal-heading" class="app-modal-heading"></h2>
        <div id="status-modal-body" class="app-modal-body"></div>

        <div id="status-modal-actions" class="app-modal-actions">
            <button id="status-modal-ok" type="button" class="app-btn app-btn-primary">OK</button>
        </div>
    </div>
</section>
