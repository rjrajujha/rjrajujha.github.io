<article class="reveal group rounded-2xl border border-slate-200/80 bg-white/80 p-6 shadow-sm transition hover:-translate-y-1 hover:shadow-lg">
    <div class="flex items-start justify-between gap-4">
        <h3 class="font-heading text-xl font-semibold text-slate-950">{{ project.title }}</h3>
        {% if project.impact %}
            <span class="rounded-full bg-emerald-100 px-3 py-1 text-xs font-medium text-emerald-800">{{ project.impact }}</span>
        {% endif %}
    </div>

    <p class="mt-3 text-sm leading-relaxed text-slate-700">{{ project.headline }}</p>
    <p class="mt-3 text-sm leading-relaxed text-slate-600">{{ project.description }}</p>

    <div class="mt-4 flex flex-wrap gap-2">
        {% for tech in project.stack_items %}
            <span class="rounded-full border border-slate-300 bg-slate-50 px-3 py-1 font-mono text-xs text-slate-700">{{ tech }}</span>
        {% endfor %}
    </div>

    <div class="mt-5 flex flex-wrap gap-3 text-sm">
        <a href="{% url 'projects:detail' project.slug %}" class="font-medium text-slate-900 underline-offset-4 transition hover:underline">Details</a>
        {% if project.source_url %}
            <a href="{{ project.source_url }}" class="font-medium text-slate-700 underline-offset-4 transition hover:underline" target="_blank" rel="noopener noreferrer">Source</a>
        {% endif %}
        {% if project.demo_url %}
            <a href="{{ project.demo_url }}" class="font-medium text-slate-700 underline-offset-4 transition hover:underline" target="_blank" rel="noopener noreferrer">Live Demo</a>
        {% endif %}
    </div>
</article>
