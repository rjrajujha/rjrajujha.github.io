<section class="hero-shell">
    <div class="reveal max-w-3xl space-y-5">
        <p class="inline-flex items-center gap-2 rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1 text-xs font-medium uppercase tracking-[0.1em] text-emerald-800 dark:border-emerald-900 dark:bg-emerald-900/50 dark:text-emerald-200">
            Open to Backend Roles &amp; Consulting
        </p>

        <div class="space-y-2.5">
            <h1 class="font-heading text-3xl font-semibold leading-tight text-slate-950 sm:text-4xl lg:text-[2.5rem] dark:text-slate-100">
                {{ profile.name }}
            </h1>
            <p class="max-w-2xl text-base leading-relaxed text-slate-700 sm:text-lg dark:text-slate-300">{{ profile.headline }}</p>
            <p class="max-w-2xl text-sm leading-relaxed text-slate-600 dark:text-slate-400">{{ profile.subheadline }}</p>
        </div>

        <div class="flex flex-wrap gap-2 pt-0.5">
            <a href="#projects" class="btn-primary">View Projects</a>
            <button type="button" class="btn-secondary" data-open-contact-modal>Start a Conversation</button>
        </div>
    </div>
</section>
