<header class="docs-mobile-header" aria-label="Mobile header">
    <div class="docs-mobile-brand">
        <a href="/" class="docs-mobile-site-name">
            <span class="docs-mobile-label-stack docs-mobile-label-stack-title">
                <span class="docs-mobile-label-full">{{ site.name }}</span>
                <span class="docs-mobile-label-short" aria-hidden="true">RJ</span>
            </span>
        </a>
        <p class="docs-mobile-site-title">
            <span class="docs-mobile-label-stack docs-mobile-label-stack-subtitle">
                <span class="docs-mobile-label-full">{{ site.title }}</span>
                <span class="docs-mobile-label-short" aria-hidden="true">SDE</span>
            </span>
        </p>
    </div>
    <button type="button" id="mobile-sidebar-toggle" class="docs-mobile-toggle" aria-controls="docs-sidebar" aria-expanded="false">
        Menu
    </button>
</header>
