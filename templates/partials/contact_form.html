<form action="{% url 'contact:submit' %}" method="post" class="reveal space-y-4 rounded-2xl border border-slate-200/90 bg-white/90 p-6 shadow-sm">
    {% csrf_token %}
    {{ contact_form.company }}

    <div>
        <label for="{{ contact_form.name.id_for_label }}" class="mb-2 block text-sm font-medium text-slate-700">Name</label>
        {{ contact_form.name }}
    </div>

    <div>
        <label for="{{ contact_form.email.id_for_label }}" class="mb-2 block text-sm font-medium text-slate-700">Email</label>
        {{ contact_form.email }}
    </div>

    <div>
        <label for="{{ contact_form.subject.id_for_label }}" class="mb-2 block text-sm font-medium text-slate-700">Subject</label>
        {{ contact_form.subject }}
    </div>

    <div>
        <label for="{{ contact_form.message.id_for_label }}" class="mb-2 block text-sm font-medium text-slate-700">Message</label>
        {{ contact_form.message }}
    </div>

    <button type="submit" class="rounded-full bg-slate-900 px-6 py-3 text-sm font-semibold text-white transition hover:bg-slate-700">
        Send Message
    </button>
</form>
