<form
    id="contact-form"
    data-contact-form="true"
    action="{% url 'contact:submit' %}"
    method="post"
    class="contact-form"
    novalidate
>
    {% csrf_token %}
    {{ contact_form.company }}

    <div class="contact-form-fields">
        <div class="contact-field" data-contact-field="name">
            <label for="{{ contact_form.name.id_for_label }}" class="form-label">Name</label>
            {{ contact_form.name }}
            <p id="contact-error-name" class="field-error" role="alert" hidden></p>
        </div>

        <div class="contact-field" data-contact-field="email">
            <label for="{{ contact_form.email.id_for_label }}" class="form-label">Email</label>
            {{ contact_form.email }}
            <p id="contact-error-email" class="field-error" role="alert" hidden></p>
        </div>

        <div class="contact-field" data-contact-field="subject">
            <label for="{{ contact_form.subject.id_for_label }}" class="form-label">Subject</label>
            {{ contact_form.subject }}
            <p id="contact-error-subject" class="field-error" role="alert" hidden></p>
        </div>

        <div class="contact-field contact-field-message" data-contact-field="message">
            <label for="{{ contact_form.message.id_for_label }}" class="form-label">Message</label>
            {{ contact_form.message }}
            <p id="contact-error-message" class="field-error" role="alert" hidden></p>
        </div>
    </div>

    <div class="contact-form-actions">
        <button type="button" class="app-btn app-btn-secondary" data-contact-cancel>Cancel</button>
        <button id="contact-submit-button" type="submit" class="app-btn app-btn-primary">Send Message</button>
    </div>
</form>
