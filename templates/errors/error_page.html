{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Raju Jha portfolio error page.">
    <script>
        (function () {
            try {
                var storageKey = "theme-preference";
                var saved = localStorage.getItem(storageKey) || "system";
                var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                var shouldUseDark = saved === "dark" || (saved === "system" && systemDark);
                document.documentElement.classList.toggle("dark", shouldUseDark);
                document.documentElement.setAttribute("data-theme", saved);
            } catch (error) {
                document.documentElement.classList.remove("dark");
                document.documentElement.setAttribute("data-theme", "system");
            }
        })();
    </script>
    <title>{{ error_code }} {{ error_title }} | Raju Jha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="bg-slate-100 font-body text-slate-900 antialiased transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100">
    <div class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-12 sm:px-6">
        <div class="pointer-events-none absolute inset-0 -z-10 overflow-hidden opacity-90">
            <div class="absolute left-[-12rem] top-[-7rem] h-[28rem] w-[28rem] rounded-full bg-emerald-200/70 blur-3xl dark:bg-emerald-800/30"></div>
            <div class="absolute right-[-10rem] top-[10rem] h-[24rem] w-[24rem] rounded-full bg-amber-100 blur-3xl dark:bg-cyan-800/30"></div>
            <div class="absolute bottom-[-8rem] left-1/2 h-[24rem] w-[24rem] -translate-x-1/2 rounded-full bg-sky-200/60 blur-3xl dark:bg-sky-800/30"></div>
        </div>

        <main class="w-full max-w-xl rounded-3xl border border-slate-200/90 bg-white/90 p-7 shadow-xl shadow-slate-300/30 backdrop-blur dark:border-slate-800 dark:bg-slate-900/85 dark:shadow-none sm:p-8">
            <p class="font-mono text-xs uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">{{ error_code }} · {{ error_title }}</p>
            <h1 class="mt-3 font-heading text-3xl font-semibold text-slate-950 dark:text-slate-100">{{ error_heading }}</h1>
            <p class="mt-4 text-sm leading-relaxed text-slate-700 dark:text-slate-300">{{ error_description }}</p>
            <p class="mt-2 text-sm leading-relaxed text-slate-600 dark:text-slate-400">{{ error_hint }}</p>

            <div class="mt-7 flex flex-wrap gap-3">
                <a href="/" class="rounded-full bg-slate-900 px-5 py-2.5 text-sm font-medium text-white transition hover:-translate-y-0.5 hover:bg-slate-700 dark:bg-emerald-500 dark:text-slate-950 dark:hover:bg-emerald-400">Back to Home</a>
                <a href="/?open=contact" class="rounded-full border border-slate-300 bg-white px-5 py-2.5 text-sm font-medium text-slate-800 transition hover:-translate-y-0.5 hover:border-slate-400 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:border-slate-500">Go to Contact</a>
            </div>
        </main>
    </div>
</body>
</html>
