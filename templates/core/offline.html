{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Offline page for Raju Jha's portfolio.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var storageKey = "theme-preference";
                var saved = localStorage.getItem(storageKey) || "system";
                var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                var shouldUseDark = saved === "dark" || (saved === "system" && systemDark);
                document.documentElement.classList.toggle("dark", shouldUseDark);
                document.documentElement.setAttribute("data-theme", saved);
            } catch (error) {
                document.documentElement.classList.remove("dark");
                document.documentElement.setAttribute("data-theme", "system");
            }
        })();
    </script>
    <title>Offline | Raju Jha</title>
    <meta name="theme-color" content="#0f172a">
    <style>
        [data-theme-option] svg {
            width: 1rem;
            height: 1rem;
            flex: none;
            display: block;
        }
    </style>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="bg-slate-100 font-body text-slate-900 antialiased transition-colors duration-300 selection:bg-amber-200 selection:text-slate-900 dark:bg-slate-950 dark:text-slate-100 dark:selection:bg-emerald-300 dark:selection:text-slate-950">
    <div class="relative min-h-screen overflow-x-clip">
        <div class="pointer-events-none absolute inset-0 -z-10 overflow-hidden opacity-90">
            <div class="absolute left-[-10rem] top-[-8rem] h-[24rem] w-[24rem] rounded-full bg-emerald-200/70 blur-3xl dark:bg-emerald-800/30"></div>
            <div class="absolute right-[-8rem] top-[8rem] h-[20rem] w-[20rem] rounded-full bg-amber-100 blur-3xl dark:bg-cyan-800/30"></div>
            <div class="absolute bottom-[-8rem] left-1/2 h-[20rem] w-[20rem] -translate-x-1/2 rounded-full bg-sky-200/60 blur-3xl dark:bg-sky-800/30"></div>
        </div>

        <header class="mx-auto flex w-full max-w-6xl items-center justify-between gap-3 px-4 py-6 sm:px-6">
            <a href="/" class="font-heading text-lg font-semibold tracking-tight text-slate-900 transition-colors hover:text-slate-700 dark:text-slate-100 dark:hover:text-slate-300">Raju Jha</a>
            <div class="theme-switch" role="group" aria-label="Theme switcher">
                <button type="button" data-theme-option="light" class="theme-option" aria-label="Use light theme" title="Light theme">
                    <span class="sr-only">Light</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path stroke-linecap="round" d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"></path>
                    </svg>
                </button>
                <button type="button" data-theme-option="dark" class="theme-option" aria-label="Use dark theme" title="Dark theme">
                    <span class="sr-only">Dark</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20 14.7A8.5 8.5 0 0 1 9.3 4a8.5 8.5 0 1 0 10.7 10.7Z"></path>
                    </svg>
                </button>
                <button type="button" data-theme-option="system" class="theme-option" aria-label="Use system theme" title="System theme">
                    <span class="sr-only">System</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                        <rect x="3.5" y="4.5" width="17" height="12" rx="2"></rect>
                        <path stroke-linecap="round" d="M8 19.5h8M12 16.5v3"></path>
                    </svg>
                </button>
            </div>
        </header>

        <main class="mx-auto flex min-h-[calc(100vh-6.5rem)] w-full max-w-3xl items-center px-4 pb-14 sm:px-6">
            <section class="w-full rounded-3xl border border-slate-200/90 bg-white/90 p-8 shadow-lg dark:border-slate-800 dark:bg-slate-900/80">
                <p class="font-mono text-xs uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">Offline Mode</p>
                <h1 class="mt-3 font-heading text-3xl font-semibold text-slate-900 dark:text-slate-100">You are currently offline</h1>
                <p class="mt-4 text-sm leading-relaxed text-slate-700 dark:text-slate-300">
                    The portfolio is not reachable right now. Check your connection and try again.
                </p>
                <div class="mt-7 flex flex-wrap gap-3">
                    <button type="button" onclick="window.location.reload()" class="rounded-full bg-slate-900 px-5 py-2.5 text-sm font-medium text-white transition hover:-translate-y-0.5 hover:bg-slate-700 dark:bg-emerald-500 dark:text-slate-950 dark:hover:bg-emerald-400">Retry</button>
                    <a href="/" class="rounded-full border border-slate-300 bg-white px-5 py-2.5 text-sm font-medium text-slate-800 transition hover:-translate-y-0.5 hover:border-slate-400 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:border-slate-500">Go Home</a>
                </div>
            </section>
        </main>
    </div>

    <script src="{% static 'js/theme.js' %}" defer></script>
</body>
</html>
